[package]
name = "opal-core"
version = "1.1.0"
edition = "2024"

[dependencies]
## Engine
tokio = { workspace = true, optional = true }
shell-words = "1.1.0"

## Config
serde = { version = "1.0.229", optional = true, features = ["derive"] }
serde_yaml = { version = "0.9.33", optional = true }

[features]
default = []

config = ["dep:serde", "dep:serde_yaml"]
engine = ["config", "dep:tokio"]
streaming = ["engine"]
