name: my_program
depends:
  - base_setup
  - common_libs
jobs:
  - name: build_and_test
    steps:
      - name: compile
        command: cargo build --release
        # OR:
      - name: test
        command: cargo
        args:
          - test
          - --all
          - --all-features
  - name: lint_code
    steps:
      - name: clippy
        command: cargo clippy