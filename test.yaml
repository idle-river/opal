name: my_program
depends:
  - base_setup
  - common_libs
jobs:
  - name: build_and_test
    steps:
      - name: compile
        command: cargo build --release
      - name: test
        command: cargo test
  - name: lint_code
    steps:
      - name: clippy
        command: cargo clippy -- -D warnings
      - name: check_formatting
        command: cargo fmt -- --check